# 작성일: 2026-08-09
# 설계자: 김유상
# 설계자 이메일: bakkus@daum.net

# 시스템 전역 표준 범용 로그 메시지 템플릿 사전 (agent_common 범용)
# 
# [Python 소스코드 내 사용 가이드]
#   from agent_common.logger import ProjectLogger, get_log_msg
#   logger = ProjectLogger.get_logger("MyProgramName")
#   logger.info(get_log_msg("INFO", "program_started", program_name="MyProgram", folder_msg="", date_msg=""))
#

logging_messages:
  DEBUG:
    # --- [스토리지 디버그 탐색] ---
    storage:
      # 예시: logger.debug("targets_detected", target_type_str="스토리지 전수", total_files_int=10, max_workers_int=4)
      targets_detected: "{target_type_str} 대상 감지: 총 {total_files_int}개 파일 [MaxWorkers={max_workers_int}]"

  INFO:
    # --- [프로그램 실행 및 동기화 생명주기] ---
    lifecycle:
      # 예시: logger.info("program_started", program_name_str="파일 이관", folder_msg_str=" [Folder=PAK]", date_msg_str=" [Date=20260804]")
      program_started: "{program_name_str} 프로그램을 가동합니다.{folder_msg_str}{date_msg_str}"

      # 예시: logger.info("client_initialized", client_name_str="Google Cloud BigQuery")
      client_initialized: "{client_name_str} 클라이언트가 성공적으로 초기화되었습니다."

      # 예시: logger.info("program_finished", program_name_str="파일 이관")
      program_finished: "{program_name_str} 프로그램 수행이 완료되었습니다."

      # 예시: logger.info("sync_started", sync_type_str="데이터베이스", src_type_str="스토리지", src_name_str="my-bucket", dst_type_str="테이블", dst_name_str="proj.ds.tbl", context_str="[Mode=Realtime]")
      sync_started: "{sync_type_str} 동기화 작업 시작: {src_type_str} '{src_name_str}' -> {dst_type_str} '{dst_name_str}' {context_str}"

      # 예시: logger.info("sync_completed", sync_type_str="데이터베이스", success_count_int=100, failure_count_int=0, total_files_int=100)
      sync_completed: "{sync_type_str} 동기화 작업 종료: 성공(또는 건너뜀) {success_count_int}개, 실패 {failure_count_int}개 / 총 {total_files_int}개"

      transfer_limit_applied: "파일 복사 제한 개수(Limit)가 적용되었습니다: [최대 제한 수={max_limit_int}개 / 추출된 전체 수={total_extracted_int}개]"

      # 예시: logger.info("run_started", lodin_dstlc_cd_str="01", target_date_str="20260804", target_folder_str="data")
      run_started: "전송 작업 시작: 구분코드={lodin_dstlc_cd_str}, 대상일자={target_date_str}, 대상폴더={target_folder_str}"

      # 예시: logger.info("run_finished", total_count_int=100, success_count_int=98, skip_count_int=2, fail_count_int=0, total_elapsed_float=12.34)
      run_finished: "전송 작업 완료: 총 처리={total_count_int}건, 성공={success_count_int}건, 건너뜀={skip_count_int}건, 실패={fail_count_int}건, 총소요시간={total_elapsed_float:.2f}초"

      # 예시: logger.info("operation_cancelled_by_user", reason_str="사용자 입력으로 WRITE_TRUNCATE 취소")
      operation_cancelled_by_user: "사용자에 의해 작업이 취소되었습니다: {reason_str}"

      # 예시: logger.info("progress_update", message_str="[작업 진행상황] 370 / 1,000 건 (37.0%) ...")
      progress_update: "{message_str}"

      # 예시: logger.info("thread_runner_no_targets", task_name_str="병렬 작업")
      thread_runner_no_targets: "{task_name_str}: 처리할 대상 데이터가 없습니다."

      # 예시: logger.info("thread_runner_execution_started", task_name_str="병렬 작업", total_items_int=100, max_workers_int=4, batch_chunk_size_int=1000)
      thread_runner_execution_started: "{task_name_str} 시작: 총 {total_items_int}개 대상 [동시워커={max_workers_int} / 배치단위={batch_chunk_size_int}]"

      # 예시: logger.info("thread_runner_execution_completed", task_name_str="병렬 작업", total_items_int=100, success_count_int=100, failure_count_int=0, total_flushed_rows_int=100, total_batches_int=1, failed_batches_int=0, elapsed_time_str="1.23s")
      thread_runner_execution_completed: "{task_name_str} 완료: 총 {total_items_int}개 대상 (성공 {success_count_int}개, 실패 {failure_count_int}개, 누적방출 {total_flushed_rows_int}개 행 / 총 {total_batches_int}배치 [실패 {failed_batches_int}건], 소요시간={elapsed_time_str})"

    # --- [데이터베이스 및 테이블 적재 범용] ---
    db:
      # 예시: logger.info("db_inline_merge_started", service_name_str="BigQuery", target_table_str="proj.ds.tbl", total_rows_int=100, chunk_size_int=500, total_chunks_int=1, pk_key_str="id")
      db_inline_merge_started: "{service_name_str} 인라인 병합(MERGE) 적재 시작: 대상테이블={target_table_str}, 총 {total_rows_int}개 행 [청크크기={chunk_size_int} / 총청크수={total_chunks_int} / PK={pk_key_str}]"

      # 예시: logger.info("db_inline_merge_chunk_completed", service_name_str="BigQuery", chunk_index_str="1/1", processed_rows_int=100, elapsed_time_str="1.20s")
      db_inline_merge_chunk_completed: "{service_name_str} 인라인 병합(MERGE) 청크 처리 완료: [청크={chunk_index_str}, 처리건수={processed_rows_int}개, 소요시간={elapsed_time_str}]"

      # 예시: logger.info("db_inline_merge_all_completed", service_name_str="BigQuery", target_table_str="proj.ds.tbl", total_rows_int=100)
      db_inline_merge_all_completed: "{service_name_str} 인라인 병합(MERGE) 전체 완료: 대상테이블={target_table_str}, 총 {total_rows_int}개 행"

      # 예시: logger.info("db_existing_keys_loaded", service_name_str="BigQuery", total_count_int=1000)
      db_existing_keys_loaded: "{service_name_str} 기존 적재 키 조회 완료: 총 {total_count_int}개 키 캐싱"

      # 예시: logger.info("db_existing_records_loaded", service_name_str="BigQuery", total_count_int=1000)
      db_existing_records_loaded: "{service_name_str} 기존 적재 레코드 메타데이터 조회 완료: 총 {total_count_int}개 캐싱"

      # 예시: logger.info("db_load_completed", service_name_str="BigQuery", total_rows_int=100, elapsed_time_str="1.20s", mode_str="INLINE_MERGE")
      db_load_completed: "{service_name_str} 적재 완료 [Mode={mode_str}]: 총 {total_rows_int}개 행, 소요시간={elapsed_time_str}"

      # 예시: logger.info("db_transfer_skipped", service_name_str="BigQuery", target_key_str="sample.json", context_info_str="[Table=tbl]")
      db_transfer_skipped: "이미 {service_name_str}에 적재된 데이터입니다. 적재를 건너뜁니다 (Skip): {target_key_str} {context_info_str}"

      # 예시: logger.info("db_bulk_load_started", service_name_str="BigQuery", total_rows_int=100, write_disposition_str="WRITE_TRUNCATE", lodin_dstlc_cd_str="01")
      db_bulk_load_started: "{service_name_str} 대량(Bulk) 적재 시작: 총 {total_rows_int}개 행 [Option={write_disposition_str} / LoadType={lodin_dstlc_cd_str}]"

      # 예시: logger.info("db_bulk_load_batch_started", service_name_str="BigQuery", batch_index_int=1, batch_rows_int=500, write_disposition_str="WRITE_APPEND")
      db_bulk_load_batch_started: "{service_name_str} 분할 배치({batch_index_int}회차) 적재 시작: 대상 행={batch_rows_int}개 [모드={write_disposition_str}]"

      # 예시: logger.info("db_bulk_load_completed", service_name_str="BigQuery", total_rows_int=100, elapsed_time_str="1.20s")
      db_bulk_load_completed: "{service_name_str} 대량(Bulk) 적재 완료: 총 {total_rows_int}개 행 [소요시간={elapsed_time_str}]"

      # 예시: logger.info("table_truncate_countdown_completed", service_name_str="BigQuery", table_name_str="TB_SAMPLE")
      table_truncate_countdown_completed: "{service_name_str} 대상 테이블({table_name_str}) WRITE_TRUNCATE 카운트다운 대기 완료: 데이터 삭제 및 적재 작업을 시작합니다."

      # 예시: logger.info("db_bulk_streaming_fallback_success", service_name_str="BigQuery", total_rows_int=100)
      db_bulk_streaming_fallback_success: "{service_name_str} 대량(Bulk) 적재 실패 후 스트리밍 Fallback 적재 성공: 총 {total_rows_int}개 행"

      # 예시: logger.info("db_delete_started", service_name_str="BigQuery", target_table_str="proj.ds.tbl", where_clause_str="jobBaseDd = '20260804'")
      db_delete_started: "{service_name_str} 테이블 데이터 정리(DELETE) 시작: [Target={target_table_str}, 조건='{where_clause_str}']"

      # 예시: logger.info("db_delete_completed", service_name_str="BigQuery", target_table_str="proj.ds.tbl", deleted_rows_int=100)
      db_delete_completed: "{service_name_str} 테이블 데이터 정리 완료: [Target={target_table_str}, 삭제 건수={deleted_rows_int}건]"

    # --- [스토리지 탐색 및 파일 전송 범용] ---
    storage:
      # 예시: logger.info("folder_search_started", search_prefix_str="folder/")
      folder_search_started: "대상 폴더 탐색 시작: {search_prefix_str}"

      # 예시: logger.info("folder_search_completed", search_prefix_str="folder/", count_int=50)
      folder_search_completed: "대상 폴더 탐색 완료: {search_prefix_str}, 발견 파일 수: {count_int}개"

      # 예시: logger.info("folder_searching", storage_type_str="스토리지", target_info_str="", search_prefix_str="folder/")
      folder_searching: "{storage_type_str} 폴더 탐색 중{target_info_str}: {search_prefix_str}"

      # 예시: logger.info("no_target_files", target_type_str="적재 대상")
      no_target_files: "{target_type_str} 대상 파일이 없습니다."

      # 예시: logger.info("targets_detected", target_type_str="적재", total_files_int=50, max_workers_int=4)
      targets_detected: "{target_type_str} 대상 감지: 총 {total_files_int}개 파일 [MaxWorkers={max_workers_int}]"

      # 예시: logger.info("transfer_completed", file_name_str="sample.pdf", size_bytes_int=102400)
      transfer_completed: "파일 전송 완료: {file_name_str}, 크기: {size_bytes_int} bytes"

      # 예시: logger.info("transfer_skipped", file_name_str="sample.pdf", dst_type_str="스토리지")
      transfer_skipped: "동일 파일이 {dst_type_str}에 존재하여 복사를 건너뜁니다: {file_name_str}"

      # 예시: logger.info("storage_clean_started", storage_type_str="GCS", prefix_str="PAK/newfile/20260804/")
      storage_clean_started: "{storage_type_str} 대상 데이터 정리(삭제) 시작: [Prefix={prefix_str}]"

      # 예시: logger.info("storage_clean_prefix_completed", storage_type_str="GCS", prefix_str="PAK/newfile/20260804/", deleted_count_int=12)
      storage_clean_prefix_completed: "{storage_type_str} 폴더 정리 완료: [Prefix={prefix_str}, 삭제 건수={deleted_count_int}건]"

      # 예시: logger.info("storage_clean_completed", storage_type_str="GCS", total_deleted_count_int=12, total_prefixes_int=1)
      storage_clean_completed: "{storage_type_str} 데이터 정리 전체 완료: 총 {total_deleted_count_int}건 삭제 (대상 접두사 {total_prefixes_int}개)"

      # 예시: logger.info("storage_date_folder_clean", storage_type_str="GCS", prefix_str="PAK/newfile/20260804/")
      storage_date_folder_clean: "{storage_type_str} 특정 일자 폴더 정리 수행: [Prefix={prefix_str}]"

      # 예시: logger.info("storage_direct_upload_completed", storage_type_str="GCS", key_str="data/sample.pdf", target_path_str="data/sample.pdf", size_bytes_int=1024)
      storage_direct_upload_completed: "{storage_type_str} 직접 스트리밍 업로드 완료: [Key={key_str}, Target={target_path_str}, 크기={size_bytes_int} bytes]"

    # --- [성능 및 작업 소요시간 연동] ---
    performance:
      # 예시: logger.info("elapsed_time", action_name_str="파일 전송", details_str="[TotalElapsed=1.20s]", context_info_str="[Key=...]")
      elapsed_time: "작업 소요시간 [{action_name_str}]: {details_str} {context_info_str}"

    # --- [외부 서비스 및 HTTP API 연동] ---
    service:
      # 예시: logger.info("api_call_started", service_name_str="외부 API", purpose_str="processor", model_name_str="gpt4")
      api_call_started: "{service_name_str} 호출 시작 [Purpose={purpose_str}, Model={model_name_str}]"

      # 예시: logger.info("api_call_success", service_name_str="외부 API", detail_str="OK")
      api_call_success: "{service_name_str} 응답 수집 성공: {detail_str}"

    # --- [설정 파일 관리 및 자동 보정] ---
    config:
      # 예시: logger.info("config_file_auto_created", file_path_str="config/config.yml")
      config_file_auto_created: "설정 파일이 존재하지 않아 기본 템플릿으로 자동 생성되었습니다: {file_path_str}"

      # 예시: logger.info("config_file_auto_repaired", file_path_str="config/config.yml", repaired_keys_str="...")
      config_file_auto_repaired: "설정 파일 내 누락된 항목이 자동 보정(Self-healing)되었습니다: {file_path_str} [보정항목={repaired_keys_str}]"

    # --- [룰 평가 및 템플릿 처리] ---
    rule:
      # 예시: logger.info("rule_eval_success", col_name_str="field", folder_val_str="common", tmpl_str="{seq}", res_str="123", json_info_str="")
      rule_eval_success: "템플릿 평가 성공{json_info_str}: [Col={col_name_str} Folder={folder_val_str} Tmpl='{tmpl_str}' Result='{res_str}']"

  WARNING:
    # --- [프로그램 생명주기 및 요약 리포트] ---
    lifecycle:
      # 예시: logger.warning("progress_milestone", message_str="[작업 진행상황] 400 / 1,000 건 (40.0%) ...")
      progress_milestone: "{message_str}"

      # 예시: logger.warning("execution_summary_report", summary_str="\n================...")
      execution_summary_report: "{summary_str}"

      # 예시: logger.warning("extension_matrix_summary_report", summary_str="\n================...")
      extension_matrix_summary_report: "{summary_str}"

    # --- [스토리지 관리 및 정리 경고] ---
    storage:
      # 예시: logger.warning("storage_clean_empty_targets", storage_type_str="GCS", prefix_str="미생성")
      storage_clean_empty_targets: "{storage_type_str} 삭제 대상 접두사에 일치하는 파일이 존재하지 않습니다: [Prefix={prefix_str}]"

      # 예시: logger.warning("storage_date_folder_purged", storage_type_str="GCS", prefix_str="PAK/newfile/20260804/", deleted_count_int=10)
      storage_date_folder_purged: "{storage_type_str} 특정 일자 잔여 폴더 정리(삭제) 완료: [Prefix={prefix_str}, 삭제 건수={deleted_count_int}건]"

    # --- [설정 파일 관리 경고] ---
    config:
      # 예시: logger.warning("config_auto_create_failed", file_path_str="config/config.yml", error_str="Permission denied")
      config_auto_create_failed: "설정 파일 자동 생성 중 오류가 발생했습니다: {file_path_str}, 에러: {error_str}"

      # 예시: logger.warning("config_auto_repair_failed", file_path_str="config/config.yml", error_str="Permission denied")
      config_auto_repair_failed: "설정 파일 자동 보정 중 오류가 발생했습니다: {file_path_str}, 에러: {error_str}"

      # 예시: logger.warning("config_default_fallback", key_str="timeout_seconds", default_val_any=30)
      config_default_fallback: "설정(key: '{key_str}') 항목이 존재하지 않습니다. 시스템 기본값({default_val_any})으로 대체하여 기동합니다."

    # --- [대체(Fallback) 및 복구 처리] ---
    fallback:
      # 예시: logger.warning("fallback_applied", target_name_str="후보 파일", fallback_key_str="default.pdf", key_str="sample.json")
      fallback_applied: "{target_name_str}을(를) 찾을 수 없어 기본 키({fallback_key_str})로 대체(Fallback) 적용합니다. [Key={key_str}]"

    # --- [룰 평가 및 템플릿 처리 경고] ---
    rule:
      # 예시: logger.warning("rule_eval_failed", col_name_str="field", folder_val_str="common", tmpl_str="{seq}", res_str="{seq}", default_fallback_str="", context_keys_str="...", json_info_str="")
      rule_eval_failed: "템플릿 평가 실패 또는 미치환 플레이스홀더 반환{json_info_str}: [Col={col_name_str} Folder={folder_val_str} Tmpl='{tmpl_str}' Res='{res_str}' Fallback='{default_fallback_str}' ContextKeys={context_keys_str}]"

      # 예시: logger.warning("rule_not_found", col_name_str="field", target_rule_str="RULES", rules_filepath_str="config/rules.yml", loaded_keys_str="...")
      rule_not_found: "규칙 설정에서 항목 정의를 찾을 수 없습니다: [Col={col_name_str} TargetRule={target_rule_str} FilePath={rules_filepath_str} LoadedKeys={loaded_keys_str}]"

      # 예시: logger.warning("tool_load_failed", func_name_str="func", module_str="module", error_str="...")
      tool_load_failed: "동적 룰 유틸리티 모듈/함수({func_name_str}) 로드 실패 (모듈: {module_str}): {error_str}"

    # --- [권한 및 접근 우회 경고] ---
    permission:
      # 예시: logger.warning("permission_fallback_applied", service_name_str="DB", action_name_str="배치 적재", fallback_mode_str="스트리밍 전용")
      permission_fallback_applied: "{service_name_str} {action_name_str} 권한 미비로 {fallback_mode_str} 모드로 전환합니다."

    # --- [외부 서비스 및 HTTP API 경고] ---
    service:
      # 예시: logger.warning("api_disabled", service_name_str="외부 API")
      api_disabled: "{service_name_str} 사용이 비활성화 상태입니다."

      # 예시: logger.warning("api_key_missing", service_name_str="외부 API", api_key_env_str="API_KEY")
      api_key_missing: "{service_name_str} API Key가 설정되어 있지 않습니다 [KeyEnv={api_key_env_str}]"

    # --- [데이터베이스 메타데이터 및 적재 경고] ---
    db:
      # 예시: logger.warning("table_fetch_failed", service_name_str="Database", fallback_ref_str="TB_SAMPLE", error_str="Table not found")
      table_fetch_failed: "{service_name_str} 테이블 객체 조회 실패로 기본 문자열 레퍼런스({fallback_ref_str})로 대체합니다: {error_str}"

      # 예시: logger.warning("existing_keys_fetch_failed", service_name_str="Database", error_str="Column not found")

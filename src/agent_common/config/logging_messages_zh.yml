      # 示例: logger.exception("tool_execution_failed", func_name_str="code.date_check", error_str="RuntimeError")
      tool_execution_failed: "动态规则工具函数执行失败 [Tool={func_name_str}], 错误: {error_str}"

    # --- [数据库装载错误] ---
    db:

      # 示例: logger.error("insert_failed", service_name_str="Database", target_name_str="TB_SAMPLE", error_str="Invalid schema")
      insert_failed: "{service_name_str} 数据写入失败: {target_name_str}, 错误: {error_str}"

      # 示例: logger.exception("load_table_from_json_failed", service_name_str="Database", target_name_str="TB_SAMPLE", error_str="Invalid schema")
      load_table_from_json_failed: "{service_name_str} 表装载失败: {target_name_str}, 错误: {error_str}"

      # 示例: logger.exception("db_table_merge_failed", service_name_str="Database", target_name_str="TB_SAMPLE", error_str="Invalid schema")
      db_table_merge_failed: "{service_name_str} 表({target_name_str}) MERGE 写入失败: {error_str}"

      # 示例: logger.exception("db_merge_load_failed", service_name_str="BigQuery", total_rows_int=100, error_str="Invalid schema")
      db_merge_load_failed: "{service_name_str} 合并(MERGE)写入最终失败: 共 {total_rows_int} 行, 错误: {error_str}"

      # 示例: logger.exception("db_load_max_retries_exceeded", service_name_str="BigQuery", max_retries_int=3, target_key_str="sample.json", error_str="Connection reset")
      db_load_max_retries_exceeded: "{service_name_str} 批次写入超过最大重试次数 ({max_retries_int}次) 最终失败: [Key={target_key_str}] 错误: {error_str}"

      # 示例: logger.exception("db_streaming_fallback_failed", service_name_str="BigQuery", target_key_str="sample.json", error_str="Permission denied")
      db_streaming_fallback_failed: "{service_name_str} 流式装载回退(Fallback)最终失败: [Key={target_key_str}] 错误: {error_str}"

      # 示例: logger.exception("db_bulk_load_failed", service_name_str="BigQuery", total_rows_int=100, error_str="Invalid schema")
      db_bulk_load_failed: "{service_name_str} 批量(Bulk)写入最终失败: 共 {total_rows_int} 行, 错误: {error_str}"

      # 示例: logger.exception("db_bulk_streaming_fallback_failed", service_name_str="BigQuery", error_str="Permission denied")
      db_bulk_streaming_fallback_failed: "{service_name_str} 批量流式回退装载最终失败: 错误: {error_str}"

      # 示例: logger.exception("db_delete_failed", service_name_str="BigQuery", target_name_str="tbl", where_clause_str="...", error_str="Permission denied")
      db_delete_failed: "{service_name_str} 表({target_name_str}) 数据清理(DELETE)失败: [条件='{where_clause_str}'], 错误: {error_str}"

      # 示例: logger.error("db_file_lock_failed", db_path_str="data/app.db", error_str="database is locked")
      db_file_lock_failed: "数据库连接失败 (路径: {db_path_str})。服务器进程或其它会话可能正在独占锁定该数据库文件，请关闭相关进程后重试: {error_str}"

      # 示例: logger.error("query_execution_failed", service_name_str="BigQuery", query_str="SELECT ...", error_str="Connection reset")
      query_execution_failed: "{service_name_str} 查询执行失败: [错误={error_str}] 查询语句: {query_str}"

    # --- [存储连接、元数据及文件传输错误] ---
    storage:
      # 示例: logger.exception("storage_client_init_failed", storage_type_str="GCS", error_str="Bucket not found")
      storage_client_init_failed: "{storage_type_str} 客户端初始化失败: {error_str}"

      # 示例: logger.error("connection_failed", service_name_str="Storage", error_str="Connection timed out")
      connection_failed: "{service_name_str} 连接失败: {error_str}"

      # 示例: logger.error("list_failed", storage_type_str="Storage", error_str="Access Denied")
      list_failed: "查询 {storage_type_str} 对象列表失败: {error_str}"

      # 示例: logger.error("bucket_not_found", storage_type_str="Storage", bucket_name_str="my-bucket", error_str="Bucket not found")
      bucket_not_found: "未找到 {storage_type_str} 存储桶或无访问权限: {bucket_name_str}, 错误: {error_str}"

      # 示例: logger.error("storage_meta_error", storage_type_str="Storage", target_name_str="path/file.pdf", error_str="404 Not Found")
      storage_meta_error: "获取 {storage_type_str} 元数据时发生错误 ({target_name_str}): {error_str}"

      # 示例: logger.error("transfer_failed", file_name_str="sample.pdf", error_str="Network dropped")
      transfer_failed: "文件传输失败: {file_name_str}, 错误: {error_str}"

      # 示例: logger.exception("storage_extract_failed", target_file_str="sample.json", error_str="KeyError")
      storage_extract_failed: "提取并转换存储文件({target_file_str})数据失败: {error_str}"

      # 示例: logger.exception("folder_search_error", search_prefix_str="folder/", error_str="Access Denied")
      folder_search_error: "搜索存储目录 '{search_prefix_str}' 时发生错误: {error_str}"

      # 示例: logger.error("json_process_error", stage_str="解码/解析", json_key_str="folder/123.json", error_str="JSONDecodeError")
      json_process_error: "元数据 {stage_str} 失败: [Key={json_key_str}], 错误: {error_str}"

      # 示例: logger.error("source_size_error", source_key_str="sample.pdf", json_key_str="sample.json", error_str="404 Not Found")
      source_size_error: "获取源文件大小失败: [Source_Key={source_key_str} JSON_Key={json_key_str}], 错误: {error_str}"

      # 示例: logger.exception("storage_clean_failed", storage_type_str="GCS", prefix_str="PAK/newfile/20260804/", error_str="Access Denied")
      storage_clean_failed: "{storage_type_str} 数据清理(删除)失败: [Prefix={prefix_str}], 错误: {error_str}"

      # 示例: logger.exception("storage_date_folder_purge_error", storage_type_str="GCS", prefix_str="PAK/newfile/20260804/", error_str="Access Denied")
      storage_date_folder_purge_error: "{storage_type_str} 特定日期残留目录清理(删除)失败: [Prefix={prefix_str}], 错误: {error_str}"

    # --- [外部服务及 HTTP API 联动错误] ---
    service:
      # 示例: logger.error("api_http_error", service_name_str="外部 API", code_int=500, detail_str="Internal Server Error")
      api_http_error: "{service_name_str} 服务端错误 HTTP {code_int}: {detail_str}"

      # 示例: logger.error("api_connection_error", service_name_str="外部联动 API", detail_str="Port unreachable")
      api_connection_error: "{service_name_str} 连接失败 (服务未启动或网络故障): {detail_str}"

      # 示例: logger.error("api_unexpected_error", service_name_str="Agent", detail_str="KeyError")
      api_unexpected_error: "{service_name_str} 联动过程中发生意外错误: {detail_str}"

      # 示例: logger.error("api_missing_field", service_name_str="Generator", field_name_str="result")
      api_missing_field: "{service_name_str} 响应中缺少 '{field_name_str}' 字段。"

    # --- [权限拒绝错误] ---
    permission:
      # 示例: logger.error("permission_denied", resource_type_str="表", resource_name_str="proj.ds.tbl", error_str="Access Denied")
      permission_denied: "由于缺乏 {resource_type_str} 访问/执行权限，操作被拒绝: {resource_name_str}, 错误: {error_str}"

  CRITICAL:
    # --- [系统严重错误] ---
    system:
      # 示例: logger.critical("client_init_failed", client_name_str="Storage", error_str="Connection refused")
      client_init_failed: "{client_name_str} 客户端初始化发生致命错误，程序即将退出: {error_str}"

      # 示例: logger.critical("fail_fast_config_missing", path_str="storage.bucket_name", desc_info_str=" (存储桶名)", config_file_str="config.yml")
      fail_fast_config_missing: "[FATAL][Fail-Fast] 必需配置项缺失，程序立即终止: '{path_str}'{desc_info_str}。请务必在配置文件({config_file_str})中定义该配置项。"

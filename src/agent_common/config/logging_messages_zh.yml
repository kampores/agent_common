      # 示例: logger.exception("schema_load_failed", namespace_str="sys", path_str="schemas/sys/sys.json", error_str="JSONDecodeError")
      schema_load_failed: "架构规范({namespace_str})文件({path_str})加载失败: {error_str}"

      # 示例: logger.exception("tool_eval_error", func_name_str="code.date_check", error_str="TypeError")

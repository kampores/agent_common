# 시스템 전역 표준 로그 메시지 템플릿 사전
# 
# [Python 소스코드 내 사용 가이드]
#   from agent_common.logger import ProjectLogger, get_log_msg
#   logger = ProjectLogger.get_logger("MyProgramName")
#   logger.info(get_log_msg("INFO", "program_started", program_name="MyProgram", folder_msg="", date_msg=""))
#

logging_messages:
  DEBUG:
    # --- [스토리지 디버그 탐색] ---
    storage:
      # 예시: logger.debug(get_log_msg("DEBUG", "targets_detected", target_type="[DEBUG 옵션] GCS 전수", total_files=10, max_workers=4))
      targets_detected: "{target_type} 대상 감지: 총 {total_files}개 파일 [MaxWorkers={max_workers}]"

  INFO:
    # --- [프로그램 실행 및 동기화 생명주기] ---
    lifecycle:
      # 예시: logger.info(get_log_msg("INFO", "program_started", program_name="파일 이관", folder_msg=" [Folder=PAK]", date_msg=" [Date=20260804]"))
      program_started: "{program_name} 프로그램을 가동합니다.{folder_msg}{date_msg}"

      # 예시: logger.info(get_log_msg("INFO", "program_finished", program_name="파일 이관"))
      program_finished: "{program_name} 프로그램 수행이 완료되었습니다."

      # 예시: logger.info(get_log_msg("INFO", "sync_started", sync_type="BigQuery", src_type="ECS Bucket", src_name="my-bucket", dst_type="BQ Table", dst_name="proj.ds.tbl", context="[Mode=Realtime]"))
      sync_started: "{sync_type} 동기화 작업 시작: {src_type} '{src_name}' -> {dst_type} '{dst_name}' {context}"

      # 예시: logger.info(get_log_msg("INFO", "sync_completed", sync_type="BigQuery", success_count=100, failure_count=0, total_files=100))
      sync_completed: "{sync_type} 동기화 작업 종료: 성공(또는 건너뜀) {success_count}개, 실패 {failure_count}개 / 총 {total_files}개"

      transfer_limit_applied: "GCS 복사 제한 개수(Limit)가 적용되었습니다: [최대 제한 수={max_limit}개 / 추출된 전체 수={total_extracted}개]"

      # 예시: logger.info(get_log_msg("INFO", "run_started", lodin_dstlc_cd="01", target_date="20260804", target_folder="kbdrive"))
      run_started: "전송 작업 시작: 구분코드={lodin_dstlc_cd}, 대상일자={target_date}, 대상폴더={target_folder}"

      # 예시: logger.info(get_log_msg("INFO", "run_finished", total_count=100, success_count=98, skip_count=2, fail_count=0, total_elapsed=12.34))
      run_finished: "전송 작업 완료: 총 처리={total_count}건, 성공={success_count}건, 건너뜀={skip_count}건, 실패={fail_count}건, 총소요시간={total_elapsed:.2f}초"

    # --- [스토리지 탐색 및 파일 전송] ---
    storage:
      # 예시: logger.info(get_log_msg("INFO", "folder_searching", storage_type="ECS", target_info=" (게시판 JSON 메타데이터)", search_prefix="kbdrive/"))
      folder_searching: "{storage_type} 폴더 탐색 중{target_info}: {search_prefix}"

      # 예시: logger.info(get_log_msg("INFO", "no_target_files", target_type="BigQuery 적재 대상 JSON"))
      no_target_files: "{target_type} 대상 파일이 없습니다."

      # 예시: logger.info(get_log_msg("INFO", "targets_detected", target_type="BigQuery 적재", total_files=50, max_workers=4))
      targets_detected: "{target_type} 대상 감지: 총 {total_files}개 파일 [MaxWorkers={max_workers}]"

      # 예시: logger.info(get_log_msg("INFO", "transfer_completed", file_name="sample.pdf", size_bytes=102400))
      transfer_completed: "파일 전송 완료: {file_name}, 크기: {size_bytes} bytes"

      # 예시: logger.info(get_log_msg("INFO", "transfer_skipped", file_name="sample.pdf", dst_type="GCS"))
      transfer_skipped: "동일 용량 파일이 {dst_type}에 존재하여 복사를 건너뜁니다: {file_name}"

    # --- [성능 및 작업 소요시간 연동] ---
    performance:
      # 예시: logger.info(get_log_msg("INFO", "elapsed_time", action_name="GCS 파일 전송", details="[TotalElapsed=1.20s CheckTime=0.10s]", context_info="[ECS_Key=...]"))
      elapsed_time: "작업 소요시간 [{action_name}]: {details} {context_info}"

    # --- [외부 서비스 및 HTTP API 연동] ---
    service:
      # 예시: logger.info(get_log_msg("INFO", "api_call_started", service_name="외부 LLM API", purpose="sql_generator", model_name="openai_gpt4o"))
      api_call_started: "{service_name} 호출 시작 [Purpose={purpose}, Model={model_name}]"

      # 예시: logger.info(get_log_msg("INFO", "api_call_success", service_name="외부 LLM API", detail="SELECT 1"))
      api_call_success: "{service_name} 응답 수집 성공: {detail}"

    # --- [룰 평가 및 템플릿 처리] ---
    rule:
      # 예시: logger.info("rule_eval_success", col_name="asstId", folder_val="bizplatform/contentinfo", tmpl="{contentInfo.seq}", res="12345", json_info="")
      rule_eval_success: "템플릿 평가 성공{json_info}: [Col={col_name} Folder={folder_val} Tmpl='{tmpl}' Result='{res}']"

  WARNING:
    # --- [대체(Fallback) 및 복구 처리] ---
    fallback:
      # 예시: logger.warning(get_log_msg("WARNING", "fallback_applied", target_name="PDF 후보 파일", fallback_key="default.pdf", key="sample.json"))
      fallback_applied: "{target_name}을(를) 찾을 수 없어 기본 키({fallback_key})로 대체(Fallback) 적용합니다. [Key={key}]"

    # --- [룰 평가 및 템플릿 처리 경고] ---
    rule:
      # 예시: logger.warning("rule_eval_failed", col_name="asstId", folder_val="bizplatform/contentinfo", tmpl="{contentInfo.seq}", res="{contentInfo.seq}", default_fallback="", context_keys="...", json_info="")
      rule_eval_failed: "템플릿 평가 실패 또는 미치환 플레이스홀더 반환{json_info}: [Col={col_name} Folder={folder_val} Tmpl='{tmpl}' Res='{res}' Fallback='{default_fallback}' ContextKeys={context_keys}]"

      # 예시: logger.warning("rule_not_found", col_name="asstId", target_rule="TCTBIIG01", rules_filepath="config/table_rules.yml", loaded_keys="...")
      rule_not_found: "테이블 규칙 설정에서 컬럼 규칙 정의를 찾을 수 없습니다: [Col={col_name} TargetRule={target_rule} FilePath={rules_filepath} LoadedKeys={loaded_keys}]"

    # --- [권한 및 접근 우회 경고] ---
    permission:
      # 예시: logger.warning(get_log_msg("WARNING", "permission_fallback_applied", service_name="BigQuery", action_name="배치 적재", fallback_mode="스트리밍 전용"))
      permission_fallback_applied: "{service_name} {action_name} 권한 미비로 {fallback_mode} 모드로 전환합니다."

    # --- [외부 서비스 및 HTTP API 경고] ---
    service:
      # 예시: logger.warning(get_log_msg("WARNING", "api_disabled", service_name="외부 LLM API"))
      api_disabled: "{service_name} 사용이 비활성화 상태입니다."

      # 예시: logger.warning(get_log_msg("WARNING", "api_key_missing", service_name="외부 LLM API", api_key_env="EXTERNAL_LLM_API_KEY"))
      api_key_missing: "{service_name} API Key가 설정되어 있지 않습니다 [KeyEnv={api_key_env}]"

    # --- [데이터베이스 메타데이터 및 적재 경고] ---
    db:
      # 예시: logger.warning("table_fetch_failed", service_name="Oracle", fallback_ref="TB_SAMPLE", error="Table not found")
      table_fetch_failed: "{service_name} 테이블 객체 조회 실패로 기본 문자열 레퍼런스({fallback_ref})로 대체합니다: {error}"

      # 예시: logger.warning("existing_keys_fetch_failed", service_name="BigQuery", error="Column not found")
      existing_keys_fetch_failed: "{service_name} 기존 적재 키 조회 중 오류 발생 (초기 적재이거나 컬럼 미존재 가능): {error}"

  ERROR:
    # --- [설정 및 정규식 오류] ---
    config:
      # 예시: logger.error(get_log_msg("ERROR", "regex_compile_error", path_regex_str=".*\\.json", error="bad character range"))
      regex_compile_error: "경로 매칭 정규식 컴파일 실패: {path_regex_str}, 에러: {error}"

      # 예시: logger.error(get_log_msg("ERROR", "missing_required_config", key="gcs.bucket_name"))
      missing_required_config: "필수 설정 정보가 누락되었습니다: {key}"

      # 예시: logger.error(get_log_msg("ERROR", "config_file_not_found", path="config/config.yml"))
      config_file_not_found: "설정 파일을 찾을 수 없습니다: {path}"

      # 예시: logger.error(get_log_msg("ERROR", "config_load_failed", error="YAML syntax error at line 5"))
      config_load_failed: "설정 파일을 불러오는 데 실패했습니다: {error}"

    # --- [데이터베이스 적재 오류] ---
    db:
      # 예시: logger.error(get_log_msg("ERROR", "insert_failed", service_name="Oracle", target_name="TB_SAMPLE", error="Invalid schema"))
      insert_failed: "{service_name} 데이터 적재 실패: {target_name}, 에러: {error}"

      # 예시: logger.exception("load_table_from_json_failed", service_name="BigQuery", target_name="TB_SAMPLE", error="Invalid schema")
      load_table_from_json_failed: "{service_name} JSON 테이블 적재 실패: {target_name}, 에러: {error}"

    # --- [스토리지 연결, 메타데이터 및 파일 전송 오류] ---
    storage:
      # 예시: logger.error(get_log_msg("ERROR", "connection_failed", service_name="Dell ECS", error="Connection timed out"))
      connection_failed: "{service_name} 연결에 실패했습니다: {error}"

      # 예시: logger.error(get_log_msg("ERROR", "list_failed", storage_type="ECS", error="Access Denied"))
      list_failed: "{storage_type} 오브젝트 목록 조회에 실패했습니다: {error}"

      # 예시: logger.error(get_log_msg("ERROR", "bucket_not_found", storage_type="GCS", bucket_name="my-bucket", error="Bucket not found"))
      bucket_not_found: "{storage_type} 버킷을 찾을 수 없거나 접근 권한이 없습니다: {bucket_name}, 에러: {error}"

      # 예시: logger.error(get_log_msg("ERROR", "storage_meta_error", storage_type="GCS", target_name="PAK/newpdf/test.pdf", error="404 Not Found"))
      storage_meta_error: "{storage_type} 메타데이터 조회 중 오류 발생 ({target_name}): {error}"

      # 예시: logger.error(get_log_msg("ERROR", "transfer_failed", file_name="sample.pdf", error="Network dropped"))
      transfer_failed: "파일 전송 실패: {file_name}, 에러: {error}"

      # 예시: logger.error(get_log_msg("ERROR", "json_process_error", stage="디코딩/파싱", json_key="PAK/contentInfo/123.json", error="JSONDecodeError"))
      json_process_error: "게시판 JSON 메타데이터 {stage} 실패: [JSON_Key={json_key}], 에러: {error}"

    # --- [외부 서비스 및 HTTP API 연동 오류] ---
    service:
      # 예시: logger.error(get_log_msg("ERROR", "api_http_error", service_name="OpenAI API", code=500, detail="Internal Server Error"))
      api_http_error: "{service_name} 서버 오류 HTTP {code}: {detail}"

      # 예시: logger.error(get_log_msg("ERROR", "api_connection_error", service_name="외부 연동 API", detail="Port 8000 unreachable"))
      api_connection_error: "{service_name} 연결 실패 (서버 미동작 또는 네트워크 장애): {detail}"

      # 예시: logger.error(get_log_msg("ERROR", "api_unexpected_error", service_name="SQL Agent", detail="KeyError 'result'"))
      api_unexpected_error: "{service_name} 연동 중 예기치 않은 오류 발생: {detail}"

      # 예시: logger.error(get_log_msg("ERROR", "api_missing_field", service_name="SQL Generator", field_name="result"))
      api_missing_field: "{service_name} 응답 내 '{field_name}' 필드가 누락되어 있습니다."

    # --- [권한 거부 오류] ---
    permission:
      # 예시: logger.error(get_log_msg("ERROR", "permission_denied", resource_type="BigQuery 테이블", resource_name="proj.ds.tbl", error="Access Denied"))
      permission_denied: "{resource_type} 접근/수행 권한이 부족하여 작업이 거부되었습니다: {resource_name}, 에러: {error}"

  CRITICAL:
    # --- [시스템 치명적 오류] ---
    system:
      # 예시: logger.critical(get_log_msg("CRITICAL", "client_init_failed", client_name="Dell ECS", error="Connection refused"))
      client_init_failed: "{client_name} 클라이언트 초기화 중 치명적 오류가 발생하여 프로그램을 종료합니다: {error}"

      # 예시: logger.critical(get_log_msg("CRITICAL", "fail_fast_config_missing", path="gcs.bucket_name", desc_info=" (버킷명)", config_file="config.yml"))
      fail_fast_config_missing: "[FATAL][Fail-Fast] 필수 설정값이 누락되어 프로그램을 즉시 종료합니다: '{path}'{desc_info}. 설정 파일({config_file})에 이 설정값을 반드시 정의하십시오."

# 공통 에러 메시지 템플릿 사전 파일
errors:
  llm:
    # HTTP 통신 오류 발생 시
    http_error: "{service_name} 서버 오류 HTTP {code}: {detail}"
    # 네트워크 연결 실패 또는 서버 미동작 시
    connection_error: "{service_name} 연결 실패 (서버 미동작 또는 네트워크 장애): {detail}"
    # 기타 예기치 않은 시스템 예외 발생 시
    unexpected_error: "{service_name} 연동 중 예기치 않은 오류 발생: {detail}"
    # 결과 JSON 내 'result' 키가 누락되었을 때
    missing_result: "{service_name} 응답 내 'result' 필드가 누락되어 있습니다."

  runner:
    # API 서버 HTTP 오류 응답 수신 시 (llm_question_runner)
    http_error: "HTTP {code}: {detail}"
    # API 서버 연결 실패 또는 네트워크 장애 시 (llm_question_runner)
    connection_error: "Could not connect to API: {detail}"


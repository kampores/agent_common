logging:
  level: "INFO"
  format: "%(asctime)s %(levelname)s [%(name)s] [%(filename)s:%(lineno)d %(funcName)s()] %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"

transfer:
  timeout_seconds: 120

bigquery:
  ignore_unknown_values: true

templates:
  config_notice_header: |
    # ==============================================================================
    # [안내 / NOTICE]
    # 본 설정 파일({config_file_name})은 프로그램 실행 시 기존 파일이 존재하지 않아
    # 기본 템플릿 스키마로 자동 생성되었습니다.
    # 
    # 원활한 프로그램 작동을 위해 실제 접속 정보(엔드포인트, 인증키, 버킷명, 테이블 등)를
    # 직접 수정하시거나, 기존에 보유하신 올바른 {config_file_name} 파일을 이 경로에 대체해 주십시오.
    # 자동 생성일시: {now_dt_str}
    # ==============================================================================

  config_repair_inline_comment: "# [자동 추가: {now_dt_str}]"
